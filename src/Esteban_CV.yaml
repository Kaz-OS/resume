design:
  theme: harvard
  page:
    size: a4
    top_margin: 0.3in
    bottom_margin: 0.3in
    left_margin: 0.3in
    right_margin: 0.3in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(30, 70, 40)
    headline: rgb(40, 90, 55)
    connections: rgb(40, 90, 55)
    section_titles: rgb(30, 70, 40)
    links: rgb(40, 90, 55)
    footer: rgb(80, 120, 90)
    top_note: rgb(80, 120, 90)
  typography:
    line_spacing: 0.465em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 10pt
      name: 20pt
      headline: 12pt
      connections: 9pt
      section_titles: 1.3em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: true
      connections: true
      section_titles: true
  links:
    underline: false
    show_external_link_icon: true
  header:
    alignment: left
    photo_width: 2cm
    photo_position: right
    photo_space_left: 0.4cm
    photo_space_right: 0cm
    space_below_name: 0.25cm
    space_below_headline: 0.3cm
    space_below_connections: 0.3cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: •
      space_between_connections: 0.4cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.8em
    space_between_text_based_entries: 0.25em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1.5cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: ""
    one_line_entry:
      main_column: "LABEL: *DETAILS*"
    education_entry:
      main_column: |-
        INSTITUTION, DEGREE (AREA)
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        *TECHNOLOGIES*
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        *TECHNOLOGIES*
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
locale:
  language: french
  last_updated: Dernière mise à jour
  month: mois
  months: mois
  year: an
  years: ans
  present: Présent
  month_abbreviations:
    - Jan
    - Fév
    - Mar
    - Avr
    - Mai
    - Juin
    - Juil
    - Aoû
    - Sep
    - Oct
    - Nov
    - Déc
  month_names:
    - Janvier
    - Février
    - Mars
    - Avril
    - Mai
    - Juin
    - Juillet
    - Août
    - Septembre
    - Octobre
    - Novembre
    - Décembre
settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    design:
    locale:
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
  pdf_title: NAME - CV
